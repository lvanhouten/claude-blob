<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blob Animations</title>
  <style>
    :root {
      --bg: #f4ede6;
      --card: #e6dbd0;
      --ink: #2e2018;
      --muted: #7a6455;
      --accent: #c2622c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #2a2420;
        --ink: #f5ebe3;
        --muted: #a8968a;
        --accent: #ff9a5c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px 48px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    header { max-width: 1280px; margin: 0 auto 24px; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 14px; }
    .grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    figure {
      margin: 0;
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
    }
    /* Crop the empty speech-bubble area off the top of the 300x380 blob page. */
    .stage {
      position: relative;
      height: 250px;
      overflow: hidden;
    }
    .stage iframe {
      position: absolute;
      left: 50%;
      top: -82px;
      width: 300px;
      height: 380px;
      margin-left: -150px;
      border: 0;
      background: transparent;
    }
    figcaption { padding: 4px 16px 16px; }
    figcaption strong { display: block; font-size: 15px; font-weight: 650; }
    figcaption code {
      display: inline-block;
      margin: 4px 0 6px;
      font-size: 12px;
      color: var(--accent);
      font-family: "Cascadia Code", Consolas, monospace;
    }
    figcaption span { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <h1>Blob animations</h1>
    <p>Every state the blob can be in, each on a loop. Click one to boop it.</p>
  </header>
  <main class="grid" id="grid"></main>
  <script>
    const ANIMATIONS = [
      ['idle', 'Idle', 'no activity', 'Hovers and bobs, arms swaying, feet drifting slowly around the hem.'],
      ['thinking', 'Thinking', 'UserPromptSubmit, PostToolUse', 'Wobbles and tilts, gazing up while it ponders.'],
      ['running', 'Running a command', 'PreToolUse: Bash, PowerShell', 'Quick little hops with a jitter; the feet race around.'],
      ['building', 'Editing files', 'PreToolUse: Edit, Write', 'Hammers away, squashing in rhythm with its arms pumping.'],
      ['reading', 'Reading', 'PreToolUse: Read, Grep, Glob', 'Sways gently while its eyes scan side to side.'],
      ['searching', 'Searching the web', 'PreToolUse: WebSearch, WebFetch', 'Turns and looks around.'],
      ['delegating', 'Delegating', 'PreToolUse: Agent, Task / SubagentStop', 'A mini-me buds off for each subagent and circles him until it finishes.'],
      ['attention', 'Needs you', 'Notification', 'Bounces, waves both arms and glows with ripples.'],
      ['done', 'Finished', 'Stop', 'Spins and transforms into a star, then back to a ghost.'],
      ['sleeping', 'Asleep', '5 minutes idle', 'Sinks to the desk, eyes closed, breathing slowly.'],
      ['star', 'Star form', 'double-click', 'Floats as a puffy star.'],
      ['jiggle', 'Jello jiggle', 'click', 'A poke sends a ripple through him and he wobbles like jello.'],
      ['dizzy', 'Dizzy', 'circle his eyes 3 times while idle', 'Spins around twice, then sways with his eyes rolling.'],
    ];

    const grid = document.getElementById('grid');
    for (const [state, title, trigger, text] of ANIMATIONS) {
      const fig = document.createElement('figure');
      fig.innerHTML = `
        <div class="stage"><iframe src="index.html?embed&state=${state}" title="${title}" loading="lazy"></iframe></div>
        <figcaption><strong>${title}</strong><code>${trigger}</code><span>${text}</span></figcaption>`;
      grid.append(fig);
    }
  </script>
</body>
</html>
