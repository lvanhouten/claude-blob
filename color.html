<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>Blob color</title>
  <style>
    :root {
      --bg: #f4ede6;
      --card: #e6dbd0;
      --ink: #2e2018;
      --muted: #7a6455;
      --accent: #c2622c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #2a2420;
        --ink: #f5ebe3;
        --muted: #a8968a;
        --accent: #ff9a5c;
      }
    }
    * { box-sizing: border-box; }
    html { overflow: hidden; } /* the window is sized to fit the page */
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--ink);
      font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    .top { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
    /* The lit side and the shade side, split the way the cel band splits him. */
    #preview {
      width: 56px; height: 56px; border-radius: 50%; flex: none;
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08);
    }
    #hex {
      width: 100%; padding: 6px 8px; border-radius: 8px;
      border: 1px solid var(--card); background: var(--card); color: var(--ink);
      font: 13px "Cascadia Code", Consolas, monospace;
    }
    #hex:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    label { display: block; margin: 0 0 10px; color: var(--muted); }
    /* Which color the sliders edit: the shade side, or a hand-picked lit side. */
    .tabs { display: flex; gap: 4px; align-items: center; margin-bottom: 12px; }
    .tabs button {
      padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer;
      background: none; color: var(--muted); font: inherit;
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button[aria-pressed=true] { background: var(--card); color: var(--ink); }
    .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* Only on the lit tab; kept in the layout so the window never changes size. */
    #auto { margin-left: auto; box-shadow: inset 0 0 0 1px var(--card); }
    #auto[aria-pressed=true] { background: none; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    #auto.off { visibility: hidden; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      display: block; width: 100%; height: 14px; margin: 4px 0 0; border-radius: 7px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 0 2px var(--ink);
    }
    .swatches { display: flex; gap: 6px; margin: 14px 0 12px; flex-wrap: wrap; }
    .swatches button {
      width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1);
    }
    .swatches button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .actions { display: flex; gap: 8px; }
    .actions button {
      padding: 6px 14px; border-radius: 8px; border: 0; cursor: pointer;
      background: var(--card); color: var(--ink); font: inherit;
    }
    .actions button:hover { color: var(--accent); }
    .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #reset { margin-right: auto; }
    #apply { background: var(--accent); color: var(--bg); font-weight: 600; }
    #apply:hover { color: var(--bg); filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="top">
    <div id="preview"></div>
    <input id="hex" spellcheck="false" maxlength="7" aria-label="Hex color">
  </div>
  <div class="tabs">
    <!-- Lit side first, matching the swatches and preview, which are lit from the upper left. -->
    <button id="tab-lit" aria-pressed="false">Lit side</button>
    <button id="tab-shade" aria-pressed="true">Shade</button>
    <button id="auto" class="off" title="Work the lit side out from the shade color">Auto</button>
  </div>
  <label>Hue <input type="range" id="h" min="0" max="360" step="1"></label>
  <label>Lightness <input type="range" id="l" step="0.005"></label>
  <label>Saturation <input type="range" id="c" min="0" max="0.32" step="0.002"></label>
  <div class="swatches" id="swatches"></div>
  <div class="actions">
    <button id="reset">Reset</button>
    <button id="cancel">Cancel</button>
    <button id="apply">Apply</button>
  </div>
  <script type="module">
    import { paletteFrom, hexToOklch, oklchToHex, clampBase, isHex, L_MIN, L_MAX, DEFAULT_COLOR, DEFAULT_LIT } from './src/palette.js';

    // Falls back to a no-op so the page can be previewed in a plain browser.
    const api = window.blob ?? { setColor() {} };
    const query = new URLSearchParams(location.search);
    const SWATCHES = ['#ff8642', '#ff6fa8', '#e03040', '#ffd23f', '#2fbf71', '#2bb5c4', '#3a7bff', '#9a5cff', '#888888'];
    // Lightness range for the sliders: the shade is clamped like the palette
    // clamps it; a hand-picked lit side can go lighter.
    const RANGE = { shade: [L_MIN, L_MAX], lit: [0.5, 0.98] };
    const $ = (id) => document.getElementById(id);
    const [h, l, c, hex, preview, auto] = ['h', 'l', 'c', 'hex', 'preview', 'auto'].map($);

    // The pick: color is the shade side; lit is a hand-picked lit side, or null
    // to work it out from color. tab is which of the two the sliders edit.
    const pick = {
      color: isHex(query.get('color')) ? query.get('color') : DEFAULT_COLOR,
      lit: isHex(query.get('lit')) ? query.get('lit') : null,
    };
    let tab = 'shade';
    const editing = () => (tab === 'shade' ? pick.color : paletteFrom(pick.color, pick.lit).lit);

    // The sliders hold OKLCH; out-of-gamut picks lose chroma on the way to hex.
    const current = () => oklchToHex([+l.value, +c.value, +h.value]);

    function paint() {
      const p = paletteFrom(pick.color, pick.lit);
      preview.style.background = `linear-gradient(135deg, ${p.lit} 0 45%, ${p.shade} 55%)`;
      const [lo, hi] = RANGE[tab];
      const L = +l.value, C = +c.value, H = +h.value;
      const stops = (f, n = 12) => Array.from({ length: n + 1 }, (_, i) => oklchToHex(f(i / n))).join(', ');
      h.style.background = `linear-gradient(to right, ${stops((t) => [L, C, t * 360], 24)})`;
      l.style.background = `linear-gradient(to right, ${stops((t) => [lo + t * (hi - lo), C, H])})`;
      c.style.background = `linear-gradient(to right, ${stops((t) => [L, t * 0.32, H])})`;
      $('tab-shade').setAttribute('aria-pressed', tab === 'shade');
      $('tab-lit').setAttribute('aria-pressed', tab === 'lit');
      auto.classList.toggle('off', tab !== 'lit');
      auto.setAttribute('aria-pressed', pick.lit === null);
    }

    // Puts the color being edited into the sliders and hex field.
    function load() {
      const color = editing();
      [l.min, l.max] = RANGE[tab];
      [l.value, c.value, h.value] = hexToOklch(tab === 'shade' ? clampBase(color) : color);
      hex.value = color.toLowerCase();
      paint();
    }

    // Everything here only previews on him; Apply keeps it, and Cancel (or
    // closing the window) puts back the colors he had.
    function edit(color) {
      if (tab === 'shade') pick.color = color;
      else pick.lit = color;
      showPreview();
    }
    function showPreview() {
      api.setColor({ ...pick }, false);
      paint();
    }
    const apply = () => { api.setColor({ ...pick }, true); window.close(); };

    for (const input of [h, l, c]) {
      input.addEventListener('input', () => { hex.value = current(); edit(current()); });
    }
    hex.addEventListener('input', () => {
      const v = hex.value.trim().replace(/^#?/, '#');
      if (!isHex(v)) return;
      [l.value, c.value, h.value] = hexToOklch(tab === 'shade' ? clampBase(v) : v);
      edit(v);
    });
    const choose = (color, lit = null) => { Object.assign(pick, { color, lit }); load(); showPreview(); };
    // A swatch sets a new shade and lets the lit side follow it; the orange one
    // brings back the original cream. Each shows both sides, split like the preview.
    for (const color of SWATCHES) {
      const lit = color === DEFAULT_COLOR ? DEFAULT_LIT : null;
      const p = paletteFrom(color, lit);
      const b = document.createElement('button');
      b.style.background = `linear-gradient(135deg, ${p.lit} 0 45%, ${p.shade} 55%)`;
      b.title = `${p.shade} / ${p.lit}`;
      b.addEventListener('click', () => choose(color, lit));
      $('swatches').append(b);
    }
    $('tab-shade').addEventListener('click', () => { tab = 'shade'; load(); });
    $('tab-lit').addEventListener('click', () => { tab = 'lit'; load(); });
    auto.addEventListener('click', () => { pick.lit = null; load(); showPreview(); });
    $('reset').title = 'Back to the original orange and cream';
    $('reset').addEventListener('click', () => choose(DEFAULT_COLOR, DEFAULT_LIT));
    $('cancel').addEventListener('click', () => window.close());
    $('apply').addEventListener('click', apply);
    addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
      if (e.key === 'Enter') apply();
    });

    load();
  </script>
</body>
</html>
